name: Native apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run editor tests
        run: |
          xcodebuild test -project apple/Slate.xcodeproj -scheme Slate \
            -destination 'platform=macOS' -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- \
            -resultBundlePath "$RUNNER_TEMP/macOS.xcresult"
      - name: Build and launch the universal app
        run: |
          xcodebuild build -project apple/Slate.xcodeproj -scheme Slate -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/build" \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=-
          app="$RUNNER_TEMP/build/Build/Products/Release/Slate.app"
          lipo "$app/Contents/MacOS/Slate" -verify_arch arm64 x86_64
          "$app/Contents/MacOS/Slate" &
          pid=$!
          sleep 3
          kill -0 "$pid"
          kill "$pid"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Slate-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Slate-macOS
          path: ${{ runner.temp }}/Slate-macOS.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macOS-test-diagnostics
          path: |
            ${{ runner.temp }}/macOS.xcresult
            ~/Library/Logs/DiagnosticReports/Slate*.ips
            ~/Library/Logs/DiagnosticReports/com.apple.WebKit*.ips

  ios:
    name: iPhone and iPad app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run editor tests and launch on iPhone and iPad
        run: |
          build="$RUNNER_TEMP/build"
          app="$build/Build/Products/Debug-iphonesimulator/Slate.app"
          for family in iPhone iPad; do
            device=$(xcrun simctl list devices available -j | jq -er --arg family "$family" \
              '[.devices | to_entries[] | select(.key | contains(".iOS-")) | .value[] |
                select(.isAvailable and (.name | startswith($family)))] | first.udid')
            echo "SIMULATOR_UDID=$device" >> "$GITHUB_ENV"
            # Xcode 16.4's iOS 18.5 simulator misses the WebKit Swift overlay when
            # linking for earlier OS versions (WebKit issue 293831).
            xcodebuild test -project apple/Slate.xcodeproj -scheme Slate \
              -configuration Debug -destination "platform=iOS Simulator,id=$device" \
              -derivedDataPath "$build" -parallel-testing-enabled NO \
              -resultBundlePath "$RUNNER_TEMP/$family.xcresult" IPHONEOS_DEPLOYMENT_TARGET=18.4
            xcrun simctl bootstatus "$device" -b
            xcrun simctl install "$device" "$app"
            bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
            xcrun simctl launch --terminate-running-process "$device" "$bundle"
            sleep 3
            xcrun simctl terminate "$device" "$bundle"
            xcrun simctl shutdown "$device"
          done
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Slate-iOS-simulator.zip"
      - name: Build the unsigned device app
        run: |
          xcodebuild build -project apple/Slate.xcodeproj -scheme Slate -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO
          app="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/Slate.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Slate-iOS-device-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Slate-iOS
          path: ${{ runner.temp }}/Slate-iOS-*.zip
          if-no-files-found: error
      - name: Collect simulator crash diagnostics
        if: failure()
        run: |
          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 10m --style compact \
              --predicate 'process == "Slate"' > "$RUNNER_TEMP/Slate-simulator.log" || true
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-test-diagnostics
          path: |
            ${{ runner.temp }}/*.xcresult
            ${{ runner.temp }}/Slate-simulator.log
            ~/Library/Logs/DiagnosticReports/Slate*.ips

  android:
    name: Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug and unsigned release APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, and run instrumented editor tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n org.slate.editor/.MainActivity
            adb shell pidof org.slate.editor
            ./gradlew :app:connectedDebugAndroidTest || (adb logcat -d -t 2500 > "$RUNNER_TEMP/Slate-android.log" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: Slate-Android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-test-diagnostics
          path: |
            android/app/build/outputs/androidTest-results
            android/app/build/reports/androidTests
            ${{ runner.temp }}/Slate-android.log
